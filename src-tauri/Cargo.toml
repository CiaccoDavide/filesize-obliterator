[package]
name = "filesize-obliterator"
version = "0.1.0"
description = "Filesize Obliterator — local media compression desktop app"
authors = ["CiaccoDavide"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "filesize_obliterator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }
webp = "0.3"
# Audio: pure-Rust decode (symphonia) + vendored LAME MP3 encode (no network / no ffmpeg runtime).
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "aac", "isomp4", "pcm"] }
mp3lame-encoder = "0.2"
tauri-plugin-opener = "2.7.0"
# Video: local ffmpeg sidecar / PATH (resolved at runtime; see compress::video_encode).
# PDF: local Ghostscript sidecar / PATH (resolved at runtime; see compress::pdf_encode).

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
